name: rest-catalog-demo

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.6}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: POLARIS
      POSTGRES_INITDB_ARGS: "--encoding UTF8 --data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-polaris-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d POLARIS"]
      interval: 3s
      timeout: 3s
      retries: 30

  polaris-bootstrap:
    image: ${POLARIS_ADMIN_IMAGE:-apache/polaris-admin-tool:1.1.0-incubating}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/POLARIS
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
    command: ["bootstrap", "--realm=POLARIS", "--credential=POLARIS,root,s3cr3t"]

  silo:
    image: ${SILO_IMAGE:-docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-m1n1opwd}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 3s
      timeout: 5s
      retries: 30

  setup-bucket:
    image: ${MCLI_IMAGE:-docker.io/pgsty/mc:RELEASE.2026-10-26T00-00-00Z}
    depends_on:
      silo:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-m1n1opwd}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://silo:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/lakehouse
        mc anonymous set none local/lakehouse
        echo "Bucket lakehouse pronto."

  polaris:
    image: ${POLARIS_IMAGE:-apache/polaris:1.1.0-incubating}
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
      silo:
        condition: service_healthy
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio_root}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-m1n1opwd}
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: 5
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: 100
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: 5000
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/POLARIS
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,${POLARIS_CLIENT_ID:-root},${POLARIS_CLIENT_SECRET:-s3cr3t}
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      QUARKUS_OTEL_SDK_DISABLED: "true"
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:${POLARIS_CONSOLE_PORT:-8088}
      QUARKUS_HTTP_CORS_METHODS: GET,POST,PUT,DELETE,HEAD,OPTIONS
      QUARKUS_HTTP_CORS_HEADERS: "*"
      QUARKUS_HTTP_CORS_EXPOSED_HEADERS: "*"
    ports:
      - "8181:8181"
      - "8182:8182"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/q/health"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 10s

  polaris-setup:
    image: alpine:3.21
    depends_on:
      polaris:
        condition: service_healthy
      setup-bucket:
        condition: service_completed_successfully
    environment:
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID:-root}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET:-s3cr3t}
    volumes:
      - ./scripts/setup-catalog.sh:/demo/setup-catalog.sh:ro
    entrypoint: ["/bin/sh", "/demo/setup-catalog.sh"]

  polaris-console:
    # O projeto ainda não publica imagem oficial; a imagem é construída a partir do apache/polaris-tools.
    image: ${POLARIS_CONSOLE_IMAGE:-local/polaris-console:demo}
    build:
      context: ${POLARIS_CONSOLE_BUILD_CONTEXT:-https://github.com/apache/polaris-tools.git#main:console}
      dockerfile: docker/Dockerfile
    depends_on:
      polaris:
        condition: service_healthy
    environment:
      # O console roda no navegador, portanto acessa o Polaris pelo endereço publicado no host.
      VITE_POLARIS_API_URL: http://localhost:8181
      VITE_POLARIS_REALM: POLARIS
      VITE_POLARIS_PRINCIPAL_SCOPE: PRINCIPAL_ROLE:ALL
      VITE_OAUTH_TOKEN_URL: http://localhost:8181/api/catalog/v1/oauth/tokens
    ports:
      - "${POLARIS_CONSOLE_PORT:-8088}:8080"

  spark:
    image: ${SPARK_IMAGE:-apache/spark:3.5.6-java17-python3}
    depends_on:
      polaris-setup:
        condition: service_completed_successfully
    environment:
      AWS_REGION: us-east-1
    volumes:
      - ./sql:/demo/sql:ro
    command: ["bash", "-lc", "trap : TERM INT; sleep infinity & wait"]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[s]leep infinity' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  trino:
    image: ${TRINO_IMAGE:-trinodb/trino:484}
    depends_on:
      polaris-setup:
        condition: service_completed_successfully
    environment:
      POLARIS_CREDENTIAL: ${POLARIS_CLIENT_ID:-root}:${POLARIS_CLIENT_SECRET:-s3cr3t}
    ports:
      - "8080:8080"
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./sql:/demo/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s

volumes:
  postgres-data:
  minio-data:
